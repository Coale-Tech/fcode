<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileBird</title>
  </head>
  <body>
    <main class="card" aria-label="FileBird is starting">
      <canvas id="stream" aria-hidden="true"></canvas>
      <div class="brand">
        <div id="wordmark"><span>FileBird</span></div>
        <p id="status" role="status">Starting…</p>
        <div id="bar" role="progressbar" aria-label="Starting FileBird" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="fill"></div>
        </div>
      </div>
    </main>
    <script type="module" src="./src/splash/splash.ts"></script>
  </body>
</html>
