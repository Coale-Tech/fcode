appId: com.titansoft.fly
productName: FileBird
copyright: Copyright © 2026 titansoft

directories:
  buildResources: resources
  output: release

files:
  - out/**
  - package.json
  - '!**/{.eslintrc,.prettierrc,.editorconfig}'
  - '!**/{tsconfig*.json,electron.vite.config.ts}'
  - '!{docs,src,release,scripts,test}/**'
  # Built for Node's ABI, so they can never load under Electron; ssh2 falls back
  # to pure JS without them (measured in M6).
  - '!node_modules/ssh2/lib/protocol/crypto/build/**'
  - '!node_modules/cpu-features/build/**'
  # node-pty carries a prebuilt terminal binary for every platform; each build
  # keeps only its own (see the per-platform lists below).
  - '!node_modules/node-pty/build/**'
  - '!node_modules/node-pty/**/*.pdb'

# Native modules can't load from inside the asar archive. node-pty also runs a
# small helper program next to its binary, which has no extension of its own.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/node-pty/prebuilds/**'

# No rebuild against Electron's headers (Milestone 10 plan D1): ssh2's optional
# native crypto falls back to pure JS under Electron (measured in M6), and
# @napi-rs/keyring ships prebuilt Node-API binaries per platform instead.
# scripts/prepare-native.mjs fetches the target's keychain binary before a
# cross-build.
npmRebuild: false

# Production hardening, flipped in the packaged binary (plan D3).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The UI is loaded from file:// modules.
  grantFileProtocolExtraPrivileges: true

mac:
  category: public.app-category.utilities
  # Each platform carries only its own keychain binaries (see prepare-native.mjs).
  files:
    - '!node_modules/@napi-rs/keyring-{win32,linux,freebsd}-*/**'
    - '!node_modules/node-pty/prebuilds/{win32,linux}-*/**'
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc only (plan D2): no certificate, and never the user's signing
  # identities. Apple Silicon needs at least this to launch the app.
  # Developer ID signing and notarisation are a separate, explicit decision.
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  # A universal build merges the x64 and arm64 apps. Each keychain binary is
  # single-arch and identical in both, so it is kept as-is rather than merged.
  x64ArchFiles: '**/node_modules/{@napi-rs/keyring-darwin-*/*.node,node-pty/prebuilds/darwin-*/*}'

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.dmg
  window:
    width: 540
    height: 400
  contents:
    - x: 140
      y: 150
    - x: 400
      y: 150
      type: link
      path: /Applications
    # Shown beside the app, so people who get the DMG know how to open an
    # app that isn't notarised yet.
    - x: 270
      y: 290
      type: file
      path: resources/dmg/How to install FileBird.txt

win:
  files:
    - '!node_modules/@napi-rs/keyring-{darwin,linux,freebsd}-*/**'
    - '!node_modules/node-pty/prebuilds/{darwin,linux}-*/**'
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  files:
    - '!node_modules/@napi-rs/keyring-{darwin,win32,freebsd}-*/**'
    - '!node_modules/node-pty/prebuilds/{darwin,win32}-*/**'
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  maintainer: titansoft
  # Lets desktop environments match the running window to the launcher entry.
  syncDesktopName: true
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
